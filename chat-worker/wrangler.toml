name = "jp-chat"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Tried in order; the next one is used when a model is overloaded.
GEMINI_MODELS = "gemini-flash-latest,gemini-flash-lite-latest"
CV_URL = "https://raw.githubusercontent.com/juanpablozunigahidalgo/astrominimalcv/main/src/content/cv/english.md"
KNOWLEDGE_URL = "https://raw.githubusercontent.com/juanpablozunigahidalgo/astrominimalcv/main/chat-worker/knowledge.md?v=2"
CALENDLY_URL = "https://calendly.com/juanpablo-zunigah/30min"
PROJECTS_REPO = "juanpablozunigahidalgo/experimentar.eu"
PROJECTS_DIR = "src/content/portafolio"
PROJECTS_SITE = "https://experimentar.eu/portafolio/"
PROJECTS_ABOUT_URL = "https://raw.githubusercontent.com/juanpablozunigahidalgo/experimentar.eu/HEAD/src/content/about/description.md"
ALLOWED_ORIGINS = "https://www.zunigajp.com,https://zunigajp.com,http://localhost:4321,http://localhost:4329"

# Max messages per visitor (IP) per minute. Gemini's free tier caps the daily total.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
